<!doctype html>
<html lang="en" data-theme="deepslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Skin Slicer — dress up Minecraft skins</title>
  <meta name="description" content="Put hats, tops and capes on any Minecraft skin, tint every colour of every piece on its own, keep outfits and swap between them. Runs entirely in your browser.">
  <!-- Owned by the script below, then by themecolor.js. iOS paints the strip
       around the Dynamic Island with this. -->
  <meta name="theme-color" content="#0F1316">
  <!-- Only applies once the page is on the Home Screen, where iOS paints the
       status bar itself and ignores theme-color; "black-translucent" hands
       that strip back to the page. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Runs before the first paint. The chosen theme lives in IndexedDB, which
       resolves long after that, so store.js mirrors it into localStorage for
       this to read back — which settles the status bar and the theme itself
       before anything is drawn instead of flashing the wrong one. All of these
       apps share one origin, hence the per-app key. -->
  <script>
  (function () {
    var BAR = { deepslate: '#0F1316', bone: '#EBE7DF' };   // --bg-base, what the root carries
    var t = 'deepslate';
    try { t = localStorage.getItem('skinslicer:theme') || 'deepslate'; } catch (e) {}
    if (!BAR[t]) t = 'deepslate';
    document.documentElement.dataset.theme = t;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', BAR[t]);
  })();
  </script>

  <!-- Link previews. og:image is left out deliberately, as in Frame & Groove. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Skin Slicer">
  <meta property="og:description" content="A 3D wardrobe for Minecraft skins: a base skin, items over it, every colour tintable, outfits you can swap. No account, no upload.">
  <meta name="twitter:card" content="summary">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/wardrobe.css">
  <link rel="stylesheet" href="css/mobile.css">

  <!-- Replaced at boot by the real pixel mark; this is only what shows in the
       tab during the first few hundred milliseconds. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='4' y='3' width='8' height='12' fill='%23DE9820'/%3E%3Crect x='1' y='3' width='3' height='6' fill='%23DE9820'/%3E%3Crect x='12' y='3' width='3' height='6' fill='%23DE9820'/%3E%3Crect x='7' y='3' width='2' height='1' fill='%235A3A12'/%3E%3Crect x='7' y='7' width='3' height='1' fill='%239BEDF1'/%3E%3C/svg%3E">
</head>
<body>
  <div id="boot">
    <div class="boot-inner">
      <canvas id="boot-mark" class="boot-mark" width="128" height="128"></canvas>
      <div class="boot-word">Skin <em>Slicer</em></div>
      <div class="boot-bar" id="boot-bar" role="progressbar" aria-label="Loading"></div>
      <div class="boot-tag" id="boot-tag">Starting up</div>
    </div>
  </div>

  <noscript>
    <div style="padding:48px;max-width:520px;margin:0 auto;font-family:system-ui;color:#EEF2F4">
      <h1>Skin Slicer needs JavaScript</h1>
      <p>The whole wardrobe — the 3D model, the tinting and the skin writer — runs in your browser.
         Nothing is uploaded anywhere, but it does need scripting enabled.</p>
    </div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
